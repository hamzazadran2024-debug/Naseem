<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متابعة حركة النقل والمركبات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#04346b;--blue:#0a5bc4;--red:#e53935;--line:#d6deea;--bg:#eef3fa;--card:#fff;--text:#14213d;--muted:#6b7a90}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--text);padding:12px}
.top{background:var(--navy);color:#fff;border-radius:14px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{text-align:center;flex:1}.brand h1{margin:0;font-size:1.5rem}.brand p{margin:2px 0 0;opacity:.9}
.date{display:flex;flex-direction:column;font-size:.9rem;text-align:left}
main{max-width:1100px;margin:14px auto;display:grid;gap:14px}
.card{background:var(--card);border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(4,52,107,.08)}
h2{margin:0 0 14px;font-size:1.1rem;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.9rem}
input,select{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.actions{display:flex;gap:10px;margin-top:14px;justify-content:center}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 22px;cursor:pointer}
.primary{background:var(--blue);color:#fff}.ghost{background:#e6e9f0;color:var(--text)}
.icon{padding:6px 10px;color:#fff;font-size:.8rem}.icon.v{background:var(--blue)}.icon.e{background:#1e88e5}.icon.d{background:var(--red)}
.error{color:var(--red);min-height:1.2em;margin:8px 0 0;font-size:.9rem}
.table-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.table-head h2{margin:0}.filters{display:flex;gap:8px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{background:#e8eef9;color:var(--navy)}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
td .icon{margin:0 2px}
.empty{color:var(--muted);padding:24px}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted);font-size:.9rem}
.pager button{padding:6px 14px;margin-inline-start:6px}
.pager button.on{background:var(--blue);color:#fff}.pager button:disabled{opacity:.4;cursor:default}
dialog{border:0;border-radius:14px;padding:20px;min-width:min(380px,92vw)}
dialog::backdrop{background:rgba(4,52,107,.45)}
dialog label{margin-bottom:10px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.kv span:first-child{color:var(--muted)}
@media (max-width:600px){.top{flex-direction:column-reverse}.date{text-align:center}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>
<header class="top">
  <div class="date"><strong id="todayDate"></strong><span id="todayDay"></span></div>
  <div class="brand"><h1 id="companyName">اسم المؤسسة</h1><p>متابعة حركة النقل والمركبات</p></div>
</header>

<main>
  <section class="card" id="formCard">
    <h2 id="formTitle">إضافة سجل جديد</h2>
    <div class="grid">
      <label>اسم السائق<input id="driver" placeholder="اكتب اسم السائق" autocomplete="off"></label>
      <label>الشركة<input id="company" placeholder="اكتب اسم الشركة" autocomplete="off"></label>
      <label>الرحلة<input id="tripNo" placeholder="رقم الرحلة"></label>
      <label>الرقم المتسلسل<input id="serialNo" placeholder="أدخل الرقم"></label>
      <label>التاريخ<input id="recordDate" type="date"></label>
    </div>
    <p class="error" id="formError" role="alert"></p>
    <div class="actions">
      <button class="primary" id="saveBtn">حفظ السجل</button>
      <button class="ghost" id="resetBtn">إعادة تعيين</button>
    </div>
  </section>

  <section class="card table-card">
    <div class="table-head">
      <h2>سجلات الرحلات</h2>
      <div class="filters">
        <input type="date" id="filterDate" aria-label="تصفية حسب التاريخ">
        <input id="filterDriver" placeholder="بحث باسم السائق" aria-label="بحث باسم السائق">
      </div>
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th>#</th><th>اسم السائق</th><th>الشركة</th><th>الرحلة</th><th>الرقم المتسلسل</th><th>التاريخ</th><th>الإجراءات</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="pager"><span id="pageInfo"></span><div id="pageBtns"></div></div>
  </section>
</main>

<dialog id="viewDialog"><div id="viewBody"></div><button class="ghost" onclick="viewDialog.close()">إغلاق</button></dialog>

<dialog id="loginDialog">
  <h2>تسجيل الدخول</h2>
  <label>البريد الإلكتروني<input id="loginEmail" type="email" autocomplete="username"></label>
  <label>كلمة المرور<input id="loginPass" type="password" autocomplete="current-password"></label>
  <p class="error" id="loginError" role="alert"></p>
  <button class="primary" id="loginBtn">دخول</button>
</dialog>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Data layer. app.js only talks to window.db, so swapping backends never touches the UI.
(function () {
  const cfg = window.APP_CONFIG;
  const useSupabase = !!(cfg.supabaseUrl && cfg.supabaseAnonKey);

  /* ---------- Local mode (localStorage) ---------- */
  const LS = "fleet-records-v1";
  const seed = {
    records: [], nextId: 1
  };
  const load = () => { try { return JSON.parse(localStorage.getItem(LS)) || structuredClone(seed); } catch { return structuredClone(seed); } };
  const save = (s) => { try { localStorage.setItem(LS, JSON.stringify(s)); } catch (e) { console.error(e); } };

  const local = {
    async listRecords({ page, pageSize, date, driver }) {
      const s = load();
      const q = (driver || "").toLowerCase();
      let rows = s.records.filter(r => (!date || r.record_date === date) && (!q || (r.driver_name || "").toLowerCase().includes(q)))
        .sort((a, b) => b.record_date.localeCompare(a.record_date) || b.id - a.id);
      const total = rows.length;
      return { rows: rows.slice((page - 1) * pageSize, page * pageSize), total };
    },
    async addRecord(r) { const s = load(); s.records.push({ ...r, id: s.nextId++ }); save(s); },
    async updateRecord(id, r) { const s = load(); const i = s.records.findIndex(x => x.id === id); if (i >= 0) s.records[i] = { ...s.records[i], ...r }; save(s); },
    async deleteRecord(id) { const s = load(); s.records = s.records.filter(x => x.id !== id); save(s); },
    async session() { return true; },
    async signIn() { return true; }
  };

  /* ---------- Supabase mode ---------- */
  let sb;
  const remote = {
    async listRecords({ page, pageSize, date, driver }) {
      let q = sb.from("records").select("*", { count: "exact" })
        .order("record_date", { ascending: false }).order("id", { ascending: false })
        .range((page - 1) * pageSize, page * pageSize - 1);
      if (date) q = q.eq("record_date", date);
      if (driver) q = q.ilike("driver_name", `%${driver.replace(/[%_]/g, "")}%`);
      const { data, count, error } = await q;
      if (error) throw error;
      return { rows: data, total: count || 0 };
    },
    async addRecord(r) { const { error } = await sb.from("records").insert(r); if (error) throw error; },
    async updateRecord(id, r) { const { error } = await sb.from("records").update(r).eq("id", id); if (error) throw error; },
    async deleteRecord(id) { const { error } = await sb.from("records").delete().eq("id", id); if (error) throw error; },
    async session() { const { data } = await sb.auth.getSession(); return !!data.session; },
    async signIn(email, password) { const { error } = await sb.auth.signInWithPassword({ email, password }); if (error) throw error; return true; }
  };

  if (useSupabase) sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  window.db = useSupabase ? remote : local;
  window.db.mode = useSupabase ? "supabase" : "local";
})();

</script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const cfg = window.APP_CONFIG;
  const state = { page: 1, editingId: null, rows: [] };
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const today = () => new Date().toISOString().slice(0, 10);

  function header() {
    $("companyName").textContent = cfg.companyName;
    const d = new Date();
    $("todayDate").textContent = today();
    $("todayDay").textContent = d.toLocaleDateString("ar", { weekday: "long" });
  }

  function resetForm() {
    state.editingId = null;
    $("driver").value = ""; $("company").value = ""; $("tripNo").value = ""; $("serialNo").value = "";
    $("recordDate").value = today();
    $("formTitle").textContent = "إضافة سجل جديد";
    $("saveBtn").textContent = "حفظ السجل";
    $("formError").textContent = "";
  }

  async function save() {
    const rec = {
      driver_name: $("driver").value.trim(),
      company_name: $("company").value.trim(),
      trip_no: $("tripNo").value.trim(),
      serial_no: $("serialNo").value.trim(),
      record_date: $("recordDate").value
    };
    if (!rec.driver_name || !rec.company_name || !rec.trip_no || !rec.record_date) {
      $("formError").textContent = "اكتب اسم السائق واسم الشركة ورقم الرحلة واختر التاريخ.";
      return;
    }
    $("saveBtn").disabled = true;
    try {
      if (state.editingId) await db.updateRecord(state.editingId, rec); else await db.addRecord(rec);
      resetForm();
      await refresh();
    } catch (e) {
      console.error(e);
      $("formError").textContent = "تعذر حفظ السجل. تحقق من الاتصال وحاول مرة أخرى.";
    } finally { $("saveBtn").disabled = false; }
  }

  async function refresh() {
    const pageSize = cfg.pageSize || 10;
    try {
      const { rows, total } = await db.listRecords({ page: state.page, pageSize, date: $("filterDate").value, driver: $("filterDriver").value.trim() });
      const pages = Math.max(1, Math.ceil(total / pageSize));
      if (state.page > pages) { state.page = pages; return refresh(); }
      state.rows = rows;
      $("rows").innerHTML = rows.length ? rows.map((r, i) => `
        <tr>
          <td>${(state.page - 1) * pageSize + i + 1}</td>
          <td>${esc(r.driver_name)}</td><td>${esc(r.company_name)}</td>
          <td>${esc(r.trip_no)}</td><td>${esc(r.serial_no)}</td><td>${esc(r.record_date)}</td>
          <td>
            <button class="icon v" data-act="view" data-id="${r.id}">عرض</button>
            <button class="icon e" data-act="edit" data-id="${r.id}">تعديل</button>
            <button class="icon d" data-act="del" data-id="${r.id}">حذف</button>
          </td></tr>`).join("") : `<tr><td colspan="7" class="empty">لا توجد سجلات. أضف أول سجل من النموذج أعلاه.</td></tr>`;
      const from = total ? (state.page - 1) * pageSize + 1 : 0;
      $("pageInfo").textContent = `عرض ${from} إلى ${Math.min(state.page * pageSize, total)} من ${total} سجل`;
      $("pageBtns").innerHTML = `<button data-p="${state.page - 1}" ${state.page <= 1 ? "disabled" : ""}>السابق</button>
        <button class="on" disabled>${state.page}</button>
        <button data-p="${state.page + 1}" ${state.page >= pages ? "disabled" : ""}>التالي</button>`;
    } catch (e) {
      console.error(e);
      $("rows").innerHTML = `<tr><td colspan="7" class="empty">تعذر تحميل السجلات. تحقق من الاتصال.</td></tr>`;
    }
  }

  function onRowAction(e) {
    const b = e.target.closest("button[data-act]"); if (!b) return;
    const id = Number(b.dataset.id); const r = state.rows.find(x => x.id === id); if (!r) return;
    if (b.dataset.act === "view") {
      $("viewBody").innerHTML = [["السائق", r.driver_name], ["الشركة", r.company_name], ["الرحلة", r.trip_no], ["الرقم المتسلسل", r.serial_no], ["التاريخ", r.record_date]]
        .map(([k, v]) => `<div class="kv"><span>${k}</span><span>${esc(v)}</span></div>`).join("");
      $("viewDialog").showModal();
    } else if (b.dataset.act === "edit") {
      state.editingId = id;
      $("driver").value = r.driver_name; $("company").value = r.company_name;
      $("tripNo").value = r.trip_no; $("serialNo").value = r.serial_no || ""; $("recordDate").value = r.record_date;
      $("formTitle").textContent = "تعديل السجل"; $("saveBtn").textContent = "حفظ التعديل";
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else if (b.dataset.act === "del") {
      if (confirm("حذف هذا السجل نهائيًا؟")) db.deleteRecord(id).then(refresh).catch(console.error);
    }
  }

  async function ensureLogin() {
    if (await db.session()) return;
    const dlg = $("loginDialog"); dlg.showModal();
    await new Promise(resolve => {
      $("loginBtn").onclick = async () => {
        try { await db.signIn($("loginEmail").value, $("loginPass").value); dlg.close(); resolve(); }
        catch { $("loginError").textContent = "البريد أو كلمة المرور غير صحيحة."; }
      };
    });
  }

  async function init() {
    header();
    await ensureLogin();
    resetForm();
    $("saveBtn").onclick = save;
    $("resetBtn").onclick = resetForm;
    $("rows").onclick = onRowAction;
    $("pageBtns").onclick = (e) => { const b = e.target.closest("button[data-p]"); if (b && !b.disabled) { state.page = Number(b.dataset.p); refresh(); } };
    $("filterDate").onchange = () => { state.page = 1; refresh(); };
    let t; $("filterDriver").oninput = () => { clearTimeout(t); t = setTimeout(() => { state.page = 1; refresh(); }, 300); };
    refresh();
  }
  init().catch(e => { console.error(e); $("rows").innerHTML = `<tr><td colspan="7" class="empty">تعذر بدء التطبيق. راجع إعدادات الاتصال في js/config.js.</td></tr>`; });
})();

</script>
</body>
</html>
